version: 2
updates:
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    groups:
      npm:
        patterns:
          - "*"
    schedule:
      interval: weekly
